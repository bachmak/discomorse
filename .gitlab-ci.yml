default:
  image: python:3.12-slim

stages:
  - lint
  - typecheck
  - build
  - docker
  - security

# ── Backend ───────────────────────────────────────────────────────────────────

.backend:
  rules:
    - changes:
        - backend/**/*

backend:lint:
  extends: .backend
  stage: lint
  script:
    - pip install uv
    - uv pip install --system ruff
    - ruff check backend/src

backend:typecheck:
  extends: .backend
  stage: typecheck
  script:
    - pip install uv
    - uv pip install --system -e backend[server-audio] mypy
    - mypy --strict backend/src

backend:security:
  extends: .backend
  stage: security
  script:
    - pip install pip-audit
    - pip-audit -r backend/pyproject.toml

backend:docker:
  extends: .backend
  stage: docker
  image: docker:26
  services:
    - docker:26-dind
  script:
    - docker build backend/ -t morse-decoder-backend

# ── Frontend ──────────────────────────────────────────────────────────────────

.frontend:
  image: node:22-alpine
  rules:
    - changes:
        - frontend/**/*

frontend:lint:
  extends: .frontend
  stage: lint
  script:
    - cd frontend && npm ci && npm run lint

frontend:typecheck:
  extends: .frontend
  stage: typecheck
  script:
    - cd frontend && npm ci && npm run typecheck

frontend:build:
  extends: .frontend
  stage: build
  script:
    - cd frontend && npm ci && npm run build

frontend:security:
  extends: .frontend
  stage: security
  script:
    - cd frontend && npm audit --audit-level=high

frontend:docker:
  extends: .frontend
  stage: docker
  image: docker:26
  services:
    - docker:26-dind
  script:
    - docker build frontend/ -t morse-decoder-frontend
