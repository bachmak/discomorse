workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"

default:
  image: python:3.12-slim

stages:
  - lint
  - typecheck
  - build
  - docker
  - security

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: copy           # avoids hardlink issues across filesystems in CI
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

# ── Templates ─────────────────────────────────────────────────────────────────

.backend:
  cache:
    key:
      files:
        - backend/pyproject.toml
    paths:
      - .cache/uv

.frontend:
  image: node:22-alpine
  cache:
    key:
      files:
        - frontend/package.json
    paths:
      - .cache/npm
      - frontend/node_modules
  before_script:
    - cd frontend && npm ci

# ── Backend ───────────────────────────────────────────────────────────────────

backend:lint:
  extends: .backend
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [backend/**/*, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - pip install uv --quiet
    - uv sync --project backend
  script:
    - uv run --project backend ruff check backend/src

backend:typecheck:
  extends: .backend
  stage: typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [backend/**/*, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - pip install uv --quiet
    - uv sync --project backend --extra server-audio
  script:
    - uv run --project backend mypy --strict backend/src

backend:docker:
  stage: docker
  image: docker:26
  services:
    - docker:26-dind
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [backend/Dockerfile, docker-compose.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [backend/Dockerfile, docker-compose.yml]
  script:
    - docker build backend/ -t morse-decoder-backend

backend:security:
  extends: .backend
  stage: security
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [backend/pyproject.toml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [backend/pyproject.toml]
  before_script:
    - pip install uv --quiet
    - uv export --project backend --no-hashes --format requirements-txt -o /tmp/reqs.txt
  script:
    - uv tool run pip-audit -r /tmp/reqs.txt

# ── Frontend ──────────────────────────────────────────────────────────────────

frontend:lint:
  extends: .frontend
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [frontend/**/*, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm run lint

frontend:typecheck:
  extends: .frontend
  stage: typecheck
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [frontend/**/*, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm run typecheck

frontend:build:
  extends: .frontend
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [frontend/**/*, .gitlab-ci.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

frontend:docker:
  stage: docker
  image: docker:26
  services:
    - docker:26-dind
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [frontend/Dockerfile, docker-compose.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [frontend/Dockerfile, docker-compose.yml]
  script:
    - docker build frontend/ -t morse-decoder-frontend

frontend:security:
  extends: .frontend
  stage: security
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [frontend/package.json]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [frontend/package.json]
  script:
    - npm audit --audit-level=high
