[project]
name = "morse-decoder"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "numpy>=2.0",
    "scipy>=1.14",
    "soundfile>=0.13",
    "pydantic-settings>=2.6",
    "tomli>=2.0",
]

[project.optional-dependencies]
server-audio = ["sounddevice>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morse_decoder"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
