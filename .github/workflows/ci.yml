name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC — security scans
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend_docker: ${{ steps.filter.outputs.backend_docker }}
      frontend_docker: ${{ steps.filter.outputs.frontend_docker }}
      backend_deps: ${{ steps.filter.outputs.backend_deps }}
      frontend_deps: ${{ steps.filter.outputs.frontend_deps }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            backend_docker:
              - 'backend/Dockerfile'
              - 'docker-compose.yml'
            frontend_docker:
              - 'frontend/Dockerfile'
              - 'docker-compose.yml'
            backend_deps:
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
            frontend_deps:
              - 'frontend/package.json'
              - 'frontend/package-lock.json'

  # ── Backend ───────────────────────────────────────────────────────────────────

  backend-lint:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --project backend
      - run: uv run --project backend ruff check backend/src backend/scripts

  backend-typecheck:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --project backend --extra server-audio
      - run: uv run --project backend mypy --strict backend/src backend/scripts

  backend-test:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg # pydub decode path
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --project backend
      - run: uv run --project backend pytest backend/tests

  backend-smoke:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Decode every generated test signal
        run: |
          failed=0
          for config in test_configs/*.json; do
            uv run python scripts/run_test_config.py "$config" || failed=1
            echo
          done
          exit $failed

  backend-docker:
    needs: changes
    if: ${{ needs.changes.outputs.backend_docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build backend/ -t morse-decoder-backend

  # ── Frontend ──────────────────────────────────────────────────────────────────

  frontend-lint:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-typecheck:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  frontend-build:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  frontend-docker:
    needs: changes
    if: ${{ needs.changes.outputs.frontend_docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build frontend/ -t morse-decoder-frontend

  frontend-security:
    needs: changes
    if: ${{ needs.changes.outputs.frontend_deps == 'true' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  # ── Wire contract ─────────────────────────────────────────────────────────────

  wire-contract:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --project backend
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run gen:ws-types
      - name: Fail if frontend types drifted from backend models
        run: git diff --exit-code frontend/src/types/ws.ts

  deploy:
    needs: [ backend-test, backend-smoke, frontend-build, backend-docker, frontend-docker, wire-contract ]
    if: ${{ always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(needs.*.result, 'failure')}}
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/dev/discomorse
            git fetch --prune origin
            git checkout -f main
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
