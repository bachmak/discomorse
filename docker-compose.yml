services:
  backend:
    build: ./backend
    environment:
      - SERVER__HOST=0.0.0.0
      - SERVER__PORT=8000
    expose:
      - "8000"

  frontend:
    build: ./frontend
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  caddy_data:
  caddy_config:
